tissue: Ovary
species: mouse
description: >-
  Ovary cell type markers from the CZI Reproductive Biology Cell
  Annotation Jamboree compilation (jamboree_markers.xlsx, 'Ovary' sheet).
  Cell state / subtype qualified entries and negative markers are excluded.
  `nonspecific` lists markers the sheet flags as also labelling other cell
  types; they remain in `markers` and are informational only. Its absence
  means unannotated, not specific -- the sheet leaves uniqueness blank for
  most entries.

cell_types:
  b_cell:
    cl_id: "0000236"
    cl_label: "B cell"
    markers: [Cd19, Cd79a, Ptprc]
    nonspecific:
      Ptprc: "All immune"
  cd8_positive_alpha_beta_regulatory_t_cell:
    cl_id: "0000795"
    cl_label: "CD8-positive, alpha-beta regulatory T cell"
    markers: [Cd8b1]
  cumulus_granulosa_cell:
    cl_id: "0000711"
    cl_label: "Cumulus granulosa cell"
    markers: [Col18a1, Cyp19a1, Elobl, Fndc5, Gatm, Gdf9, H1foo, Kctd14, Khdc1b, Nlrp14, Npm2, Nupr1, Padi6, Uchl1, Wt1, Zbed3]
  dendritic_cell:
    cl_id: "0000451"
    cl_label: "Dendritic cell"
    markers: [Clec10a, Clec9a, Fscn1, Itgax]
    nonspecific:
      Itgax: ~
  double_negative_t_regulatory_cell:
    cl_id: "0011024"
    cl_label: "Double negative T regulatory cell"
    markers: [Cd3e, Il7r, Tcrgc2, Tmem176b]
    nonspecific:
      Il7r: "Innate lymphoid cells"
      Tmem176b: "DCs, macrophages, innate lymphoid cells"
  early_luteal_cell:
    cl_id: "4052046"
    cl_label: "Early luteal cell"
    markers: [Lhcgr, Parm1, Prlr, Star]
    nonspecific:
      Lhcgr: "Theca cells"
      Parm1: ~
      Prlr: ~
      Star: ~
  effector_cd4_positive_alpha_beta_t_cell:
    cl_id: "0001044"
    cl_label: "Effector CD4-positive, alpha-beta T cell"
    markers: [Cd28, Cd4]
    nonspecific:
      Cd28: ~
  eosinophil:
    cl_id: "0000771"
    cl_label: "Eosinophil"
    markers: [S100a8, S100a9]
  granulosa_cell:
    cl_id: "0000501"
    cl_label: "Granulosa cell"
    markers: [Amh, Areg, Bex4, Btc, Cyp19a1, Ereg, Fam13a, Fgfr1, Foxl2, Foxp2, Fshr, Gdf7, Gja4, Grem2, Hsd17b1, Inha, Ivns1abp, Kcnq5, Lect1, Nr5a2, Pgr, Prkar2b, Sema5a, Serpine2, Slc18a2, Socs2, Star, Tuba1a, Wt1]
    nonspecific:
      Foxp2: ~
      Grem2: ~
      Hsd17b1: ~
      Inha: ~
      Kcnq5: ~
      Prkar2b: ~
      Sema5a: ~
      Serpine2: "Oocytes, SMCs, stromal cells"
      Star: "Luteal"
  group_2_innate_lymphoid_cell:
    cl_id: "0001069"
    cl_label: "Group 2 innate lymphoid cell"
    markers: [Il17rb]
  group_3_innate_lymphoid_cell:
    cl_id: "0001071"
    cl_label: "Group 3 innate lymphoid cell"
    markers: [Tmem176b]
    nonspecific:
      Tmem176b: "DCs, macrophages, DNT"
  interna_theca_cell:
