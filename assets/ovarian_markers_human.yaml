tissue: Ovary
species: human
description: >-
  Ovary cell type markers from the CZI Reproductive Biology Cell
  Annotation Jamboree compilation (jamboree_markers.xlsx, 'Ovary' sheet).
  Cell state / subtype qualified entries and negative markers are excluded.
  `nonspecific` lists markers the sheet flags as also labelling other cell
  types; they remain in `markers` and are informational only. Its absence
  means unannotated, not specific -- the sheet leaves uniqueness blank for
  most entries.

cell_types:
  cumulus_granulosa_cell:
    cl_id: "0000711"
    cl_label: "Cumulus granulosa cell"
    markers: [FST, HTRA1, IGFBP2, IHH, INHBB, VCAN]
  endothelial_cell:
    cl_id: "0000115"
    cl_label: "Endothelial cell"
    markers: [CD34, CDH5, EMCN, FLI1, FLT1, NES, NUAK1, PALMD, PECAM1, PIK3R3, PODXL]
  endothelial_cell_of_vascular_tree:
